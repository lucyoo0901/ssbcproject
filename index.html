<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 성도교제밤 촬영일자</title>
  <meta name="description" content="2026 성도교제밤 영상 촬영 일정, 씬 스케줄, 콘티와 촬영 인원 안내">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 코드 수정 후 다시 올릴 때 ?v= 숫자를 바꾸면 방문자 브라우저에 바로 새 버전이 적용됩니다 -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🎬</span>
        <div>
          <div class="brand-sub">2026</div>
          <div class="brand-title">성도교제밤 촬영일자</div>
        </div>
      </div>
      <nav class="nav" aria-label="메뉴">
        <button class="nav-item active" data-view="calendar"><span aria-hidden="true">📅</span> 촬영 캘린더</button>
        <button class="nav-item" data-view="people"><span aria-hidden="true">👥</span> 촬영 인원</button>
        <button class="nav-item" data-view="supplies"><span aria-hidden="true">🎒</span> 준비물</button>
        <button class="nav-item" data-view="script"><span aria-hidden="true">📝</span> 대본</button>
        <button class="nav-item" data-view="storyboard"><span aria-hidden="true">🎞️</span> 스토리보드</button>
      </nav>
      <section class="side-section">
        <h2 class="side-h">촬영 일정</h2>
        <div id="upcoming" class="upcoming"></div>
      </section>
      <section class="side-section legend-section">
        <h2 class="side-h">일정 종류</h2>
        <ul class="legend">
          <li><span class="sw t-shoot"></span>촬영</li>
          <li><span class="sw t-edit"></span>편집</li>
          <li><span class="sw t-meet"></span>회의</li>
          <li><span class="sw t-etc"></span>기타</li>
        </ul>
      </section>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <div id="scrim" class="scrim" data-act="close-day"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="날짜별 일정"></aside>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="씬 콘티 보기"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">이 페이지를 보려면 자바스크립트를 켜 주세요.</p></noscript>
  <script src="app.js?v=2"></script>
</body>
</html>
